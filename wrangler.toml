name = "nfc-bible-verse"
main = "worker/index.js"
compatibility_date = "2026-11-01"

# Astro's static build output. The Worker runs first on every request so it can
# fill in /verse.htm and keep the raw template private.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# Daily verse store.
# Create with:  npx wrangler kv namespace create VERSES   and paste the id below.
[[kv_namespaces]]
binding = "VERSES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# New verse at 05:00 UTC (midnight EST / 1 AM EDT).
[triggers]
crons = ["0 5 * * *"]

# Settings to iterate on (strings).
[vars]
KEEP_LINE_BREAKS = "true"    # "false" = always one paragraph
REJECT_FRAGMENTS = "false"   # "true"  = refetch verses that start mid-sentence / end on a comma
MAX_TRIES = "5"              # refetch attempts when REJECT_FRAGMENTS is on

# Uncomment once 031600.xyz is active in Cloudflare.
# routes = [
#   { pattern = "031600.xyz", custom_domain = true },
# ]
