name = "nfc-bible-verse"
main = "worker/index.js"
compatibility_date = "2026-11-01"

# Astro's static build output. The Worker runs first on every request so it can
# fill in /verse.htm and keep the raw template private.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# Daily verse store.
# KV namespace "nfc-bible-verse-VERSES"
[[kv_namespaces]]
binding = "VERSES"
id = "7f8b361e366c43d1bef2e8e465fa9de9"

# New verse at 05:00 UTC (midnight EST / 1 AM EDT).
[triggers]
crons = ["0 5 * * *"]

# Settings to iterate on (strings).
[vars]
KEEP_LINE_BREAKS = "true"    # "false" = always one paragraph
REJECT_FRAGMENTS = "true"    # "true"  = refetch verses that start mid-sentence / end on a comma
MAX_TRIES = "5"              # refetch attempts when REJECT_FRAGMENTS is on
# Books to draw from (bible-api book IDs). Empty = whole Bible.
# Psalms, Proverbs, Isaiah, Gospels, Epistles (Romans-Jude)
BOOKS = "PSA,PRO,ISA,MAT,MRK,LUK,JHN,ROM,1CO,2CO,GAL,EPH,PHP,COL,1TH,2TH,1TI,2TI,TIT,PHM,HEB,JAS,1PE,2PE,1JN,2JN,3JN,JUD"

# Uncomment once 031600.xyz is active in Cloudflare.
# routes = [
#   { pattern = "031600.xyz", custom_domain = true },
# ]
